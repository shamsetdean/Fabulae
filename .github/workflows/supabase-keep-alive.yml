name: Supabase keep alive

# Interroge la base Supabase tous les 3 jours pour empêcher
# la mise en pause automatique du projet (plan gratuit : pause après 7 jours d'inactivité).

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Requête vers Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_TABLE" ]; then
            echo "Secrets manquants : SUPABASE_URL, SUPABASE_ANON_KEY ou SUPABASE_TABLE"
            exit 1
          fi

          # Nettoyage des valeurs : espaces, retours à la ligne, barre oblique finale, suffixe /rest/v1
          BASE_URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          BASE_URL="${BASE_URL%/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          BASE_URL="${BASE_URL%/}"
          KEY=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          TABLE=$(printf '%s' "$SUPABASE_TABLE" | tr -d '[:space:]')

          STATUS=$(curl -s -o response.txt -w "%{http_code}" \
            "${BASE_URL}/rest/v1/${TABLE}?select=*&limit=1" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}")

          echo "Réponse Supabase : HTTP ${STATUS}"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Base sollicitée avec succès."
          else
            echo "Détail renvoyé par Supabase :"
            head -c 500 response.txt
            echo
            echo "Échec de la requête."
            exit 1
          fi
